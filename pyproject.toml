[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-inverse-studies"
version = "0.1.0"
description = "Reproducible studies connecting time-frequency analysis, sparse representations and imaging inverse problems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8", "PyWavelets>=1.5", "Pillow>=10"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "ipython>=8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
